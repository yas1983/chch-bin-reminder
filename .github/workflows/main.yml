name: 微信垃圾桶提醒

on:
  schedule:
    # 每天 UTC 07:00 运行（对应新西兰标准时间 19:00）
    - cron: '0 7 * * *' 
  workflow_dispatch: # 允许手动点击运行

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行提醒脚本
        run: python bin_reminder.py
